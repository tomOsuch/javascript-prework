<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamień, papier, nożyce</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Gra: Kamień, papier, nożyce</h1>
    </header>

    <section class="section-role">
        <h2>Zasady gry</h2>
        <p>Wybierz swój ruch, klikając jeden z przycisków poniżej. Komputer również wybierze swój ruch losowo. Zobacz,
            kto wygra!</p>
    </section>

    <section class="section-play">
        <h2>Wybierz swój ruch:</h2>
        <div id="buttons">
            <button class="play-button" id="play-rock">Kamień</button>
            <button class="play-button" id="play-paper">Papier</button>
            <button class="play-button" id="play-scissors">Nożyce</button>
        </div>
    </section>

    <section class="section-messages">
        <h2>Wyniki gry:</h2>
        <div id="messages"></div>
    </section>

    <script src="js/functions.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
